# Circuitos admitidos en el identificador de sesión <año>-<circuito>-<tipo>.
#
# La clave es el slug del identificador (minúsculas, sin acentos, palabras separadas por guion).
# - nombre: nombre legible en español.
# - openf1: valor exacto de circuit_short_name en https://api.openf1.org/v1/sessions.
#
# Verificado contra sessions?year=2026 el 2026-11-14. Para sumar un circuito, consultar
# ese endpoint para el año que corresponda y copiar circuit_short_name tal cual.

